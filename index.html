## Correspondencias entre OSM y OpenData

Antes de empezar

- ✔ Compatibilidad con OSM
- ✔ Calidad
- ✔ Cobertura espacial y temporal
- ✔ Viabilidad para los contribuidores

----

### Cómo funciona

Fusión de datos

- Fuente
  - Formato de archivo, metadatos
- Conflate
  - Distancia / ref
  - Punto, Línea, <del>Polígono</del>
- Correspondencia de etiquetas
  - OpenData ➡ OSM

----

```python
"https://datos.madrid.es/portal/site/egob/menuitem.c05c1f754a33a9fbe4b2e4b284f1a5a0/?vgnextoid=1239827b864f4410VgnVCM2000000c205a0aRCRD",
"Bici. Aparcabicis",
SHP(Source(
    attribution = "Ayuntamiento de Madrid",
    fileUrl = "https://datos.madrid.es/egob/catalogo/205099-14-aparca-bicis.zip")),
LoadGeomCentroid(
    select = {"ESTADO": ["ACTIVO", "OPERATIVO"]}),
Conflate(
    select = Select(
        types = ["nodes", "ways"],
        tags = {"amenity": "bicycle_parking"}),
    conflationDistance = 20,
    mapping = Mapping(
        static1 = {"amenity": "bicycle_parking"},
        static2 = {"source": self.source},
        text = lambda tags, fields: ', '.join([
          fields["DIRECCION"],
          fields["COMPLEMENTO_DIRECCION"],
          fields["DISTRITO"]
        ]) ))
```

[En Osmose](https://osmose.openstreetmap.fr/es/map/#item=8150%2C8151%2C8152&level=1%2C2%2C3&loc=15/40.46655/-3.68754)
